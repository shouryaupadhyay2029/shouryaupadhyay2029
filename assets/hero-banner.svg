<svg xmlns="http://www.w3.org/2000/svg" width="900" height="278" viewBox="0 0 900 278" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="900" y2="278" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050712"/>
      <stop offset="55%" stop-color="#080C1E"/>
      <stop offset="100%" stop-color="#050712"/>
    </linearGradient>
    <radialGradient id="crimsonAura" cx="84%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#E11D48" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanAura" cx="14%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentRule" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0"/>
      <stop offset="35%" stop-color="#E11D48" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.85" fill="#94A3B8" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="898" height="276" rx="16"/>
    </clipPath>
    <style>
      .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      @keyframes radarSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes livePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.28; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes blipPulse {
        0%, 100% { opacity: 0.95; r: 3.2; }
        50% { opacity: 0.25; r: 1.8; }
      }
      @keyframes waveShift {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -160; }
      }
      .radar-arm {
        transform-origin: 760px 136px;
        animation: radarSpin 7.5s linear infinite;
      }
      .live-dot { animation: livePulse 2s ease-in-out infinite; }
      .cursor-blk { animation: cursorBlink 1s steps(1) infinite; }
      .blip-1 { animation: blipPulse 2.8s ease-in-out infinite; }
      .blip-2 { animation: blipPulse 3.6s ease-in-out 1.1s infinite; }
      .wave-flow { animation: waveShift 6s linear infinite; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Obsidian Canvas & Ambient Auras -->
    <rect x="0" y="0" width="900" height="278" fill="url(#heroBg)"/>
    <rect x="0" y="0" width="900" height="278" fill="url(#dotGrid)"/>
    <rect x="0" y="0" width="900" height="278" fill="url(#crimsonAura)"/>
    <rect x="0" y="0" width="900" height="278" fill="url(#cyanAura)"/>

    <!-- Top Glass Bar -->
    <rect x="0" y="0" width="900" height="38" fill="#0B1024" fill-opacity="0.88"/>
    <line x1="0" y1="38" x2="900" y2="38" stroke="#94A3B8" stroke-opacity="0.16" stroke-width="1"/>

    <!-- Window Dots + Status -->
    <circle cx="24" cy="19" r="4.5" fill="#FF5F56"/>
    <circle cx="40" cy="19" r="4.5" fill="#FFBD2E"/>
    <circle cx="56" cy="19" r="4.5" fill="#27C93F"/>

    <circle cx="84" cy="19" r="3.5" fill="#10B981" class="live-dot"/>
    <text x="96" y="23" class="mono" font-size="10.5" font-weight="700" fill="#CBD5E1" letter-spacing="1.2">SYSTEM ONLINE</text>
    <text x="206" y="23" class="mono" font-size="10.5" fill="#64748B" letter-spacing="0.8">·  USAR AUTOMATION &amp; ROBOTICS  ·  IOT STREAM</text>

    <rect x="708" y="9" width="170" height="20" rx="10" fill="#E11D48" fill-opacity="0.14" stroke="#E11D48" stroke-opacity="0.45" stroke-width="1"/>
    <text x="793" y="22.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#FDA4AF" letter-spacing="1.1">✦ NPM AUTHOR · 2026</text>

    <!-- Precision HUD Corner Brackets -->
    <path d="M22 64 L22 52 L34 52" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.3"/>
    <path d="M878 64 L878 52 L866 52" stroke="#E11D48" stroke-opacity="0.55" stroke-width="1.3"/>
    <path d="M22 252 L22 264 L34 264" stroke="#E11D48" stroke-opacity="0.55" stroke-width="1.3"/>
    <path d="M878 252 L878 264 L866 264" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.3"/>

    <!-- Live Animated Tactical Radar Graphic (Right Side) -->
    <g opacity="0.95">
      <circle cx="760" cy="136" r="78" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="1"/>
      <circle cx="760" cy="136" r="54" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3 4"/>
      <circle cx="760" cy="136" r="28" stroke="#E11D48" stroke-opacity="0.28" stroke-width="1"/>
      <line x1="674" y1="136" x2="846" y2="136" stroke="#94A3B8" stroke-opacity="0.14" stroke-width="1"/>
      <line x1="760" y1="50" x2="760" y2="222" stroke="#94A3B8" stroke-opacity="0.14" stroke-width="1"/>

      <!-- Rotating Radar Sweep Wedge -->
      <g class="radar-arm">
        <path d="M760 136 L760 58 A78 78 0 0 1 827 97 Z" fill="url(#sweepGrad)"/>
        <line x1="760" y1="136" x2="760" y2="58" stroke="#38BDF8" stroke-width="1.6" stroke-opacity="0.88"/>
      </g>

      <!-- Radar Target Blips -->
      <circle cx="792" cy="96" r="3" fill="#E11D48" class="blip-1"/>
      <circle cx="792" cy="96" r="8" stroke="#E11D48" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="722" cy="162" r="2.8" fill="#10B981" class="blip-2"/>
      <circle cx="760" cy="136" r="3.5" fill="#F8FAFC"/>
      <text x="760" y="232" text-anchor="middle" class="mono" font-size="8.5" fill="#64748B" letter-spacing="1.4">RADAR TELEMETRY · 20HZ LOCK</text>
    </g>

    <!-- Eyebrow Pill -->
    <rect x="44" y="64" width="272" height="22" rx="4" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="56" y="79" class="mono" font-size="10" font-weight="700" fill="#7DD3FC" letter-spacing="1.5">00 // SYSTEMS ARCHITECT &amp; BUILDER</text>

    <!-- Hero Display Name -->
    <text x="44" y="132" class="sans" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8">SHOURYA UPADHYAY</text>

    <!-- Gradient Signature Rule -->
    <rect x="44" y="145" width="260" height="2.5" rx="1.25" fill="url(#accentRule)"/>

    <!-- Role Subtitle -->
    <text x="44" y="175" class="sans" font-size="15.5" font-weight="500" fill="#CBD5E1">
      IoT &amp; Robotics Engineer  <tspan fill="#E11D48" font-weight="700">·</tspan>  Full-Stack Systems  <tspan fill="#38BDF8" font-weight="700">·</tspan>  AI DevTools Creator
    </text>

    <!-- Tagline -->
    <text x="44" y="198" class="mono" font-size="11.5" fill="#94A3B8">
      Engineering deterministic simulators, real-time GIS radar &amp; localhost flight recorders.
    </text>

    <!-- Live CLI Prompt Bar at Bottom -->
    <rect x="44" y="216" width="596" height="36" rx="7" fill="#04060F" stroke="#94A3B8" stroke-opacity="0.22" stroke-width="1"/>
    <text x="60" y="238.5" class="mono" font-size="12">
      <tspan fill="#38BDF8" font-weight="700">→ ~</tspan>
      <tspan fill="#FFFFFF" font-weight="600">  npx blackbox-flight-recorder demo</tspan>
      <tspan fill="#64748B">   # try my npm flight recorder</tspan>
    </text>
    <rect x="614" y="226.5" width="8.5" height="15" rx="1" fill="#E11D48" class="cursor-blk"/>

    <!-- Animated Bottom Telemetry Hairline -->
    <path d="M0 274 L900 274" stroke="url(#scanLine)" stroke-width="2" stroke-dasharray="140 20" class="wave-flow"/>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="0.75" y="0.75" width="898.5" height="276.5" rx="16" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="1.2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240" fill="none">
  <defs>
    <linearGradient id="bgBB" x1="0" y1="0" x2="440" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060814"/>
      <stop offset="100%" stop-color="#0B0E22"/>
    </linearGradient>
    <radialGradient id="glowBB" cx="88%" cy="16%" r="52%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#E11D48" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topBarBB" x1="0" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="55%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.1"/>
    </linearGradient>
    <clipPath id="clipBB">
      <rect x="1" y="1" width="438" height="238" rx="14"/>
    </clipPath>
    <style>
      .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      @keyframes recBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes ecgMove {
        0% { stroke-dashoffset: 96; }
        100% { stroke-dashoffset: 0; }
      }
      .rec-dot { animation: recBlink 1.4s ease-in-out infinite; }
      .ecg { stroke-dasharray: 48 48; animation: ecgMove 2.6s linear infinite; }
    </style>
  </defs>

  <g clip-path="url(#clipBB)">
    <rect x="0" y="0" width="440" height="240" fill="url(#bgBB)"/>
    <rect x="0" y="0" width="440" height="240" fill="url(#glowBB)"/>
    <rect x="0" y="0" width="440" height="3" fill="url(#topBarBB)"/>

    <!-- Top Row: Badge + Animated Flight Telemetry Mini-Widget -->
    <rect x="22" y="20" width="166" height="22" rx="4" fill="#E11D48" fill-opacity="0.14" stroke="#E11D48" stroke-opacity="0.45" stroke-width="1"/>
    <text x="32" y="34.5" class="mono" font-size="9.5" font-weight="700" fill="#FDA4AF" letter-spacing="1.0">01 · DEVTOOLS · NPM LIVE</text>

    <!-- Mini Telemetry Oscilloscope -->
    <rect x="336" y="18" width="82" height="30" rx="6" fill="#04060F" stroke="#E11D48" stroke-opacity="0.32" stroke-width="1"/>
    <circle cx="348" cy="33" r="3" fill="#E11D48" class="rec-dot"/>
    <polyline points="356,33 364,33 368,24 373,41 378,27 383,33 392,33 396,26 401,38 405,33 412,33" stroke="#FB7185" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="ecg"/>

    <!-- Title & Subtitle -->
    <text x="22" y="76" class="sans" font-size="25" font-weight="800" fill="#FFFFFF" letter-spacing="-0.4">BLACKBOX</text>
    <text x="22" y="97" class="mono" font-size="11" font-weight="600" fill="#FDA4AF">Localhost Flight Recorder &amp; Causal Time-Travel Engine</text>

    <!-- Description -->
    <text x="22" y="124" class="sans" font-size="12.5" fill="#94A3B8">Zero-config 60s rolling flight recorder capturing DOM</text>
    <text x="22" y="142" class="sans" font-size="12.5" fill="#94A3B8">clicks, HTTP wiretap, VLQ source maps, Git diffs &amp; MCP.</text>

    <!-- Tech Pills -->
    <rect x="22" y="159" width="66" height="22" rx="5" fill="#0E1428" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="1"/>
    <text x="55" y="173.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#E2E8F0">Node.js</text>

    <rect x="96" y="159" width="82" height="22" rx="5" fill="#0E1428" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="1"/>
    <text x="137" y="173.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#E2E8F0">WebSockets</text>

    <rect x="186" y="159" width="48" height="22" rx="5" fill="#0E1428" stroke="#E11D48" stroke-opacity="0.4" stroke-width="1"/>
    <text x="210" y="173.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#FDA4AF">MCP</text>

    <rect x="242" y="159" width="84" height="22" rx="5" fill="#0E1428" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="1"/>
    <text x="284" y="173.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#E2E8F0">SourceMaps</text>

    <!-- Bottom Action Strip -->
    <line x1="22" y1="198" x2="418" y2="198" stroke="#94A3B8" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="22" y="220" class="mono" font-size="11" font-weight="700" fill="#FFFFFF">→  EXPLORE REPOSITORY</text>
    <text x="418" y="220" text-anchor="end" class="mono" font-size="10" fill="#38BDF8">npm: blackbox-flight-recorder</text>
  </g>

  <rect x="0.75" y="0.75" width="438.5" height="238.5" rx="14" stroke="#E11D48" stroke-opacity="0.34" stroke-width="1.2"/>
</svg>

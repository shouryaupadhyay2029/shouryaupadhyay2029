<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240" fill="none">
  <defs>
    <linearGradient id="bgSK" x1="0" y1="0" x2="440" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060814"/>
      <stop offset="100%" stop-color="#0B0E22"/>
    </linearGradient>
    <radialGradient id="glowSK" cx="88%" cy="16%" r="52%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#A78BFA" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topBarSK" x1="0" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="55%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="clipSK">
      <rect x="1" y="1" width="438" height="238" rx="14"/>
    </clipPath>
    <style>
      .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      @keyframes eqBar {
        0%, 100% { transform: scaleY(0.38); }
        50% { transform: scaleY(1); }
      }
      .b1 { transform-origin: 382px 46px; animation: eqBar 1.3s ease-in-out infinite; }
      .b2 { transform-origin: 390px 46px; animation: eqBar 1.1s ease-in-out 0.2s infinite; }
      .b3 { transform-origin: 398px 46px; animation: eqBar 1.45s ease-in-out 0.4s infinite; }
      .b4 { transform-origin: 406px 46px; animation: eqBar 1.2s ease-in-out 0.15s infinite; }
    </style>
  </defs>

  <g clip-path="url(#clipSK)">
    <rect x="0" y="0" width="440" height="240" fill="url(#bgSK)"/>
    <rect x="0" y="0" width="440" height="240" fill="url(#glowSK)"/>
    <rect x="0" y="0" width="440" height="3" fill="url(#topBarSK)"/>

    <!-- Top Row: Badge + Animated Assistive Audio/Signal Bars -->
    <rect x="22" y="20" width="144" height="22" rx="4" fill="#10B981" fill-opacity="0.13" stroke="#10B981" stroke-opacity="0.45" stroke-width="1"/>
    <text x="32" y="34.5" class="mono" font-size="9.5" font-weight="700" fill="#6EE7B7" letter-spacing="1.0">04 · ASSISTIVE TECH</text>

    <!-- Animated Signal Bars -->
    <rect x="372" y="18" width="46" height="32" rx="6" fill="#04060F" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="380" y="24" width="4" height="22" rx="2" fill="#10B981" class="b1"/>
    <rect x="388" y="24" width="4" height="22" rx="2" fill="#34D399" class="b2"/>
    <rect x="396" y="24" width="4" height="22" rx="2" fill="#A78BFA" class="b3"/>
    <rect x="404" y="24" width="4" height="22" rx="2" fill="#6EE7B7" class="b4"/>

    <!-- Title & Subtitle -->
    <text x="22" y="76" class="sans" font-size="25" font-weight="800" fill="#FFFFFF" letter-spacing="-0.4">SAKSHAM</text>
    <text x="22" y="97" class="mono" font-size="11" font-weight="600" fill="#6EE7B7">Assistive Technology &amp; Accessibility Platform</text>

    <!-- Description -->
    <text x="22" y="124" class="sans" font-size="12.5" fill="#94A3B8">Empowering independence through intelligent assistive</text>
    <text x="22" y="142" class="sans" font-size="12.5" fill="#94A3B8">utilities, adaptive UI controls &amp; real-time automation.</text>

    <!-- Tech Pills -->
    <rect x="22" y="159" width="80" height="22" rx="5" fill="#0E1428" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
    <text x="62" y="173.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#6EE7B7">TypeScript</text>

    <rect x="110" y="159" width="56" height="22" rx="5" fill="#0E1428" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="1"/>
    <text x="138" y="173.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#E2E8F0">React</text>

    <rect x="174" y="159" width="66" height="22" rx="5" fill="#0E1428" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="1"/>
    <text x="207" y="173.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#E2E8F0">Node.js</text>

    <rect x="248" y="159" width="56" height="22" rx="5" fill="#0E1428" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1"/>
    <text x="276" y="173.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#DDD6FE">A11y</text>

    <!-- Bottom Action Strip -->
    <line x1="22" y1="198" x2="418" y2="198" stroke="#94A3B8" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="22" y="220" class="mono" font-size="11" font-weight="700" fill="#FFFFFF">→  EXPLORE REPOSITORY</text>
    <text x="418" y="220" text-anchor="end" class="mono" font-size="10" fill="#6EE7B7">HUMAN-FIRST AUTOMATION</text>
  </g>

  <rect x="0.75" y="0.75" width="438.5" height="238.5" rx="14" stroke="#10B981" stroke-opacity="0.32" stroke-width="1.2"/>
</svg>

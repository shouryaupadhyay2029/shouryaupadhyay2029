<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240" fill="none">
  <defs>
    <linearGradient id="bgMD" x1="0" y1="0" x2="440" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060814"/>
      <stop offset="100%" stop-color="#0B0E22"/>
    </linearGradient>
    <radialGradient id="glowMD" cx="88%" cy="16%" r="52%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topBarMD" x1="0" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="55%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.1"/>
    </linearGradient>
    <clipPath id="clipMD">
      <rect x="1" y="1" width="438" height="238" rx="14"/>
    </clipPath>
    <style>
      .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      @keyframes lockRot {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes lockPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .reticle { transform-origin: 396px 36px; animation: lockRot 9s linear infinite; }
      .lock-dot { animation: lockPulse 1.6s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#clipMD)">
    <rect x="0" y="0" width="440" height="240" fill="url(#bgMD)"/>
    <rect x="0" y="0" width="440" height="240" fill="url(#glowMD)"/>
    <rect x="0" y="0" width="440" height="3" fill="url(#topBarMD)"/>

    <!-- Top Row: Badge + Animated Tactical Target Crosshair -->
    <rect x="22" y="20" width="166" height="22" rx="4" fill="#F59E0B" fill-opacity="0.13" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1"/>
    <text x="32" y="34.5" class="mono" font-size="9.5" font-weight="700" fill="#FCD34D" letter-spacing="1.0">03 · DEFENSE SIM · 20HZ</text>

    <!-- Animated Tactical Crosshair -->
    <circle cx="396" cy="36" r="18" fill="#04060F" stroke="#F59E0B" stroke-opacity="0.28" stroke-width="1"/>
    <g class="reticle">
      <circle cx="396" cy="36" r="12" stroke="#F59E0B" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="6 4"/>
      <line x1="396" y1="20" x2="396" y2="25" stroke="#FCD34D" stroke-width="1.4"/>
      <line x1="396" y1="47" x2="396" y2="52" stroke="#FCD34D" stroke-width="1.4"/>
      <line x1="380" y1="36" x2="385" y2="36" stroke="#FCD34D" stroke-width="1.4"/>
      <line x1="407" y1="36" x2="412" y2="36" stroke="#FCD34D" stroke-width="1.4"/>
    </g>
    <circle cx="396" cy="36" r="2.6" fill="#E11D48" class="lock-dot"/>

    <!-- Title & Subtitle -->
    <text x="22" y="76" class="sans" font-size="25" font-weight="800" fill="#FFFFFF" letter-spacing="-0.4">MoD DRONES</text>
    <text x="22" y="97" class="mono" font-size="11" font-weight="600" fill="#FCD34D">Deterministic Counter-Drone Threat Simulation Trainer</text>

    <!-- Description -->
    <text x="22" y="124" class="sans" font-size="12.5" fill="#94A3B8">Bit-identical 20Hz offline drone &amp; swarm defense trainer</text>
    <text x="22" y="142" class="sans" font-size="12.5" fill="#94A3B8">with Web Worker isolation, PRNG forking &amp; state hashing.</text>

    <!-- Tech Pills -->
    <rect x="22" y="159" width="80" height="22" rx="5" fill="#0E1428" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1"/>
    <text x="62" y="173.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#FCD34D">TypeScript</text>

    <rect x="110" y="159" width="56" height="22" rx="5" fill="#0E1428" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="1"/>
    <text x="138" y="173.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#E2E8F0">React</text>

    <rect x="174" y="159" width="86" height="22" rx="5" fill="#0E1428" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="1"/>
    <text x="217" y="173.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#E2E8F0">Web Workers</text>

    <rect x="268" y="159" width="52" height="22" rx="5" fill="#0E1428" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="1"/>
    <text x="294" y="173.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#E2E8F0">Vite</text>

    <!-- Bottom Action Strip -->
    <line x1="22" y1="198" x2="418" y2="198" stroke="#94A3B8" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="22" y="220" class="mono" font-size="11" font-weight="700" fill="#FFFFFF">→  EXPLORE REPOSITORY</text>
    <text x="418" y="220" text-anchor="end" class="mono" font-size="10" fill="#FCD34D">100% DETERMINISTIC CORE</text>
  </g>

  <rect x="0.75" y="0.75" width="438.5" height="238.5" rx="14" stroke="#F59E0B" stroke-opacity="0.32" stroke-width="1.2"/>
</svg>

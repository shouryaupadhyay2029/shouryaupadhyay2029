<svg xmlns="http://www.w3.org/2000/svg" width="900" height="72" viewBox="0 0 900 72" fill="none">
  <defs>
    <linearGradient id="footBg" x1="0" y1="0" x2="900" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050712"/>
      <stop offset="50%" stop-color="#0A0F24"/>
      <stop offset="100%" stop-color="#050712"/>
    </linearGradient>
    <linearGradient id="footAccent" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0"/>
      <stop offset="28%" stop-color="#E11D48" stop-opacity="0.8"/>
      <stop offset="72%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      .pdot { animation: pulseDot 2s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="898.5" height="70.5" rx="12" fill="url(#footBg)" stroke="#94A3B8" stroke-opacity="0.2" stroke-width="1.2"/>
  <line x1="40" y1="1.5" x2="860" y2="1.5" stroke="url(#footAccent)" stroke-width="1.5"/>

  <circle cx="34" cy="36" r="4" fill="#10B981" class="pdot"/>
  <text x="48" y="32" class="mono" font-size="11" font-weight="700" fill="#F8FAFC" letter-spacing="1.2">ARCHITECTED BY SHOURYA UPADHYAY</text>
  <text x="48" y="49" class="mono" font-size="10" fill="#64748B" letter-spacing="0.6">USAR Automation &amp; Robotics · Building IoT, Deterministic Simulators &amp; AI DevTools</text>

  <rect x="688" y="22" width="186" height="28" rx="6" fill="#E11D48" fill-opacity="0.14" stroke="#E11D48" stroke-opacity="0.45" stroke-width="1"/>
  <text x="781" y="39.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#FDA4AF" letter-spacing="1.0">✦ LET&apos;S BUILD TOGETHER</text>
</svg>

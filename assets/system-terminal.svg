<svg xmlns="http://www.w3.org/2000/svg" width="900" height="296" viewBox="0 0 900 296" fill="none">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="900" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050712"/>
      <stop offset="100%" stop-color="#080C1C"/>
    </linearGradient>
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="termClip">
      <rect x="1" y="1" width="898" height="294" rx="14"/>
    </clipPath>
    <style>
      .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.45; }
      }
      .cur { animation: blink 1s steps(1) infinite; }
      .pulse { animation: glowPulse 3.2s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#termClip)">
    <rect x="0" y="0" width="900" height="296" fill="url(#termBg)"/>

    <!-- macOS Terminal Titlebar -->
    <rect x="0" y="0" width="900" height="36" fill="#0D1226"/>
    <line x1="0" y1="36" x2="900" y2="36" stroke="#94A3B8" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="22" cy="18" r="5" fill="#FF5F56"/>
    <circle cx="38" cy="18" r="5" fill="#FFBD2E"/>
    <circle cx="54" cy="18" r="5" fill="#27C93F"/>
    <text x="450" y="22" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#94A3B8" letter-spacing="0.8">shourya@usar — telemetry-dossier</text>
    <text x="876" y="22" text-anchor="end" class="mono" font-size="10" fill="#64748B">zsh · utf-8</text>

    <!-- Left Telemetry Monogram Panel -->
    <rect x="24" y="54" width="218" height="218" rx="10" fill="#04060F" stroke="#94A3B8" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="133" cy="140" r="76" fill="url(#logoGlow)"/>

    <!-- Precision Geometric Vector Emblem (Aerospace Hexagon + Core Node) -->
    <g transform="translate(133, 134)">
      <polygon points="0,-54 47,-27 47,27 0,54 -47,27 -47,-27" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.3"/>
      <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="#0A1024" stroke="#E11D48" stroke-opacity="0.7" stroke-width="1.4"/>
      <line x1="-47" y1="0" x2="-33" y2="0" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.3"/>
      <line x1="33" y1="0" x2="47" y2="0" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.3"/>
      <line x1="0" y1="-54" x2="0" y2="-38" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.3"/>
      <line x1="0" y1="38" x2="0" y2="54" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.3"/>
      <text x="0" y="8" text-anchor="middle" class="mono" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">SU</text>
      <circle cx="0" cy="-54" r="3" fill="#38BDF8" class="pulse"/>
      <circle cx="0" cy="54" r="3" fill="#E11D48" class="pulse"/>
    </g>

    <text x="133" y="216" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#F8FAFC" letter-spacing="1.6">SHOURYA.SYS</text>
    <text x="133" y="234" text-anchor="middle" class="mono" font-size="9.5" fill="#10B981" letter-spacing="0.9">● ACTIVE · OPEN TO COLLAB</text>
    <text x="133" y="254" text-anchor="middle" class="mono" font-size="9" fill="#64748B">WIN 11  |  UBUNTU  |  ESP32</text>

    <!-- Right CLI Output Stream -->
    <text x="268" y="72" class="mono" font-size="12">
      <tspan fill="#38BDF8" font-weight="700">→ ~</tspan>
      <tspan fill="#FFFFFF" font-weight="700">  blackbox inspect --engineer shouryaupadhyay2029</tspan>
    </text>

    <line x1="268" y1="84" x2="872" y2="84" stroke="#94A3B8" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- Key-Value Readouts -->
    <text x="268" y="108" class="mono" font-size="11.5">
      <tspan fill="#10B981" font-weight="700">✓</tspan>
      <tspan fill="#7DD3FC" font-weight="700">  INSTITUTE   </tspan>
      <tspan fill="#64748B">:: </tspan>
      <tspan fill="#E2E8F0">USAR — Univ. School of Automation &amp; Robotics (IoT)</tspan>
    </text>

    <text x="268" y="131" class="mono" font-size="11.5">
      <tspan fill="#10B981" font-weight="700">✓</tspan>
      <tspan fill="#7DD3FC" font-weight="700">  ROLE        </tspan>
      <tspan fill="#64748B">:: </tspan>
      <tspan fill="#E2E8F0">IoT Systems Architect · Full-Stack &amp; DevTools Engineer</tspan>
    </text>

    <text x="268" y="154" class="mono" font-size="11.5">
      <tspan fill="#10B981" font-weight="700">✓</tspan>
      <tspan fill="#7DD3FC" font-weight="700">  CORE STACK  </tspan>
      <tspan fill="#64748B">:: </tspan>
      <tspan fill="#E2E8F0">TypeScript · Python · JavaScript · C++ · React · FastAPI</tspan>
    </text>

    <text x="268" y="177" class="mono" font-size="11.5">
      <tspan fill="#10B981" font-weight="700">✓</tspan>
      <tspan fill="#7DD3FC" font-weight="700">  HARDWARE    </tspan>
      <tspan fill="#64748B">:: </tspan>
      <tspan fill="#E2E8F0">ESP32 · Raspberry Pi · Arduino · GIS &amp; Radar Telemetry</tspan>
    </text>

    <text x="268" y="200" class="mono" font-size="11.5">
      <tspan fill="#E11D48" font-weight="700">✦</tspan>
      <tspan fill="#FDA4AF" font-weight="700">  LATEST SHIP </tspan>
      <tspan fill="#64748B">:: </tspan>
      <tspan fill="#FFFFFF" font-weight="700">BLACKBOX</tspan>
      <tspan fill="#94A3B8"> — Localhost Flight Recorder (</tspan>
      <tspan fill="#38BDF8">npm live</tspan>
      <tspan fill="#94A3B8">)</tspan>
    </text>

    <text x="268" y="223" class="mono" font-size="11.5">
      <tspan fill="#F59E0B" font-weight="700">✦</tspan>
      <tspan fill="#FCD34D" font-weight="700">  FLAGSHIPS   </tspan>
      <tspan fill="#64748B">:: </tspan>
      <tspan fill="#E2E8F0">BLACKBOX  ·  TEJAS  ·  MoD Drones  ·  SAKSHAM</tspan>
    </text>

    <line x1="268" y1="242" x2="872" y2="242" stroke="#94A3B8" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- Bottom Blinking Prompt -->
    <text x="268" y="266" class="mono" font-size="12">
      <tspan fill="#38BDF8" font-weight="700">→ ~</tspan>
      <tspan fill="#64748B">  ready for next mission...</tspan>
    </text>
    <rect x="468" y="254" width="8.5" height="15" rx="1" fill="#E11D48" class="cur"/>
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="294.5" rx="14" stroke="#94A3B8" stroke-opacity="0.22" stroke-width="1.2"/>
</svg>
